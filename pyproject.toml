[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmp-scan"
version = "0.1.0"
description = "Probe TCP reachability while varying source ports for ECMP diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ecmp-scan = "ecmp_scan:main"

[tool.setuptools]
py-modules = ["ecmp_scan"]
